name: Heartbeat keep-alive

# Projetos Supabase Free podem pausar após uma semana de pouca atividade.
# Três leituras por dia dão margem para atrasos do agendador e atividade baixa.
on:
  schedule:
    # UTC; fora do começo da hora, quando o GitHub pode atrasar ou perder jobs.
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Consultar banco pelo REST do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/heartbeat.sh
