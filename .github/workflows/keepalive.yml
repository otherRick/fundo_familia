name: Keep server alive

on:
  schedule:
    # GitHub Actions interpreta o horário em UTC.
    - cron: "0 9 */3 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping application
        env:
          # Aceita tanto uma variável quanto uma secret do repositório.
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL || secrets.KEEPALIVE_URL }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "::notice::Nenhuma KEEPALIVE_URL configurada; o heartbeat do Supabase continuará mantendo o projeto ativo."
            exit 0
          fi

          curl --fail --silent --show-error --location --max-time 30 "$KEEPALIVE_URL"
