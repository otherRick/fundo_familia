name: Keep server alive

on:
  schedule:
    # GitHub Actions interpreta o horário em UTC.
    - cron: "0 9 */5 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping application
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          test -n "$KEEPALIVE_URL"
          curl --fail --silent --show-error --location --max-time 30 "$KEEPALIVE_URL"
